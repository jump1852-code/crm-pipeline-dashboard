name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Committed data is reproducible
        run: |
          python scripts/generate_data.py
          git diff --exit-code -- site/data data
      - name: Tests (generator + browser smoke tests)
        run: pytest -v
